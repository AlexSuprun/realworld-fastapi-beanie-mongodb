[project]
name = "conduit-api"
version = "1.0.0"
description = "RealWorld Conduit API - FastAPI + Beanie + MongoDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beanie>=2.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.126.0",
    "motor>=3.7.1",
    "passlib[argon2]>=1.7.4",
    "pydantic-settings>=2.12.0",
    "python-jose>=3.5.0",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]
